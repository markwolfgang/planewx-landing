<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ad.size" content="width=300,height=250">
<title>PlaneWX AOPA 300x250 expandable</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  * { box-sizing: border-box; }

  /* Expand direction: right (default) or left. Set via JS CONFIG.expandDirection. */
  #ad {
    position: absolute;
    top: 0;
    left: 0; /* left edge anchored for rightward expand */
    width: 300px;
    height: 250px;
    overflow: hidden;
    z-index: 100; /* collapsed: 0-4999 */
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: pointer;
    border: 1px solid #BFDBFE;
    background: #0B1B33;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }
  #ad.is-expanded {
    width: 600px;
    z-index: 50000; /* expanded: 5000-1999999 */
  }
  #ad.expand-left {
    left: auto;
    right: 0;
  }

  .panels {
    position: absolute;
    top: 0;
    left: 0;
    width: 600px;
    height: 250px;
    display: flex;
    flex-direction: row;
  }
  #ad.expand-left .panels {
    left: auto;
    right: 0;
    flex-direction: row-reverse;
  }

  .panel {
    position: relative;
    width: 300px;
    height: 250px;
    flex: 0 0 300px;
    overflow: hidden;
  }

  /* DOM order: PlaneWX (collapsed) then 5X5 (opens on expand to the right) */
  .panel-main {
    background: #0B1B33;
    padding: 10px 12px 10px;
    display: flex;
    flex-direction: column;
  }

  .logo-row {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }
  .logo-wordmark {
    display: block;
    width: 132px;
    height: 26px;
    object-fit: contain;
    object-position: left center;
  }
  .tagline {
    margin: 1px 0 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff;
    line-height: 1.2;
  }

  .main-body {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    flex: 1;
    min-height: 0;
  }

  .gauge-wrap {
    flex: 0 0 auto;
    width: 96px;
    text-align: center;
  }
  .gauge {
    width: 96px;
    height: 96px;
    display: block;
  }
  .gauge-label {
    margin-top: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #94A3B8;
    text-transform: uppercase;
  }
  .gauge-pct {
    fill: #FACC15;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: 24px;
  }

  .copy-col {
    flex: 1;
    min-width: 0;
    padding-top: 2px;
  }
  .lead {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    color: #fff;
  }
  .steps {
    margin: 6px 0 0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.25;
    color: #38BDF8;
    white-space: nowrap;
  }

  .cta {
    display: block;
    margin: 8px auto 0;
    width: 220px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(90deg, #22D3EE 0%, #2563EB 100%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 2px;
    letter-spacing: -0.01em;
    cursor: pointer;
    line-height: 32px;
    text-align: center;
    padding: 0 10px;
  }

    if (params.expand === "left" || params.expand === "right") {
      CONFIG.expandDirection = params.expand;
    }

    if (CONFIG.expandDirection === "left") {
      ad.classList.add("expand-left");
    }

    function openClick() {
      window.open(clickTag, "_blank");
    }

    function setExpanded(on, sticky) {
      expanded = !!on;
      if (typeof sticky === "boolean") stickyExpand = sticky;
      if (!expanded) stickyExpand = false;
      if (expanded) ad.classList.add("is-expanded");
      else ad.classList.remove("is-expanded");
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "planewx-aopa-ad", expanded: expanded }, "*");
        }
      } catch (e) {}
    }

    function expand(sticky) { setExpanded(true, sticky === true); }
    function collapse() { setExpanded(false, false); }

    // Whole unit click to clickTag (buttons included), except close.
    // In demo mode, click/tap expands instead of navigating (close still collapses).
    ad.addEventListener("click", function (e) {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      if (demoMode) {
        if (!expanded) expand(true);
        else openClick();
        return;
      }
      openClick();
    });

    ad.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (demoMode) {
          if (!expanded) expand(true);
          else openClick();
        } else {
          openClick();
        }
      }
    });

    closeBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      collapse();
    });

    ad.addEventListener("mouseenter", function () {
      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function () { expand(false); }, CONFIG.hoverExpandDelayMs);
    });
    ad.addEventListener("mouseleave", function () {
      if (hoverTimer) clearTimeout(hoverTimer);
      if (!stickyExpand) collapse();
    });

    // Parent-driven expand for demos / touch toggles
    window.addEventListener("message", function (ev) {
      var data = ev && ev.data;
      if (!data || data.type !== "planewx-aopa-ad-cmd") return;
      if (data.action === "expand") expand(true);
      if (data.action === "collapse") collapse();
      if (data.action === "toggle") setExpanded(!expanded, true);
    });

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function tick(now) {
      if (animStopped) return;
      if (!animStart) animStart = now;
      var elapsed = now - animStart;

      if (!scoreDone) {
        var t = Math.min(1, elapsed / CONFIG.gaugeMs);
        var eased = easeOutCubic(t);
        var score = Math.round(CONFIG.targetScore * eased);
        var offset = CIRC * (1 - (CONFIG.targetScore / 100) * eased);
        gaugeArc.setAttribute("stroke-dashoffset", String(offset));
        gaugeText.textContent = score + "%";
        if (t >= 1) {
          scoreDone = true;
          gaugeText.textContent = CONFIG.targetScore + "%";
        }
      }

      if (elapsed >= CONFIG.maxAnimationMs) {
        animStopped = true;
        if (rafId) cancelAnimationFrame(rafId);
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    // Cap any animation at 15s, then stop.
    rafId = requestAnimationFrame(tick);
    setTimeout(function () {
      animStopped = true;
      if (rafId) cancelAnimationFrame(rafId);
    }, CONFIG.maxAnimationMs);

    // Expose tiny API for page demos
    window.PlaneWxAopaAd = {
      expand: expand,
      collapse: collapse,
      toggle: function () { setExpanded(!expanded); },
      isExpanded: function () { return expanded; }
    };
  })();
</script>
</body>
</html>
